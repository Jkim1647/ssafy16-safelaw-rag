[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-navigator"
version = "0.1.0"
description = "Privacy-first Korean legal statute and precedent RAG navigator"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.1,<2",
    "langgraph>=1.2.10,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
# 심화 F2013 HTML·CSS·JS 화면용 API 서버 (명세서 지정 버전)
web = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"legal_rag.web" = ["static/*"]

