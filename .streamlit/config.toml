# 로펌 상담실 테마: 상담 기록지(본문), 호두나무 벽판(사이드바), 황동 장식, 짙은 남색 버튼.
[theme]
base = "light"
primaryColor = "#1F2C3D"
backgroundColor = "#FCFBF8"
secondaryBackgroundColor = "#EEF0F2"
textColor = "#1D232B"
borderColor = "#D8D4CA"
baseRadius = "4px"
font = "IBM Plex Sans KR:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Nanum Myeongjo:https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap, serif"

[theme.sidebar]
backgroundColor = "#2C1F18"
secondaryBackgroundColor = "#3B2A20"
textColor = "#EFE6D8"
primaryColor = "#C9A46A"
borderColor = "#5A4334"

[server]
headless = true

[client]
# NF2004: 처리하지 못한 예외가 생겨도 화면에는 일반 오류 문구만 보이고 추적 정보는 콘솔에만 남긴다.
showErrorDetails = "none"

[browser]
gatherUsageStats = false
